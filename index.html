<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EAZY — Status de Entregas</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d29;
    --border: #2a2e3d;
    --text: #e8e9ed;
    --text-secondary: #9a9db0;
    --verde: #3ddc84;
    --amarelo: #ffd166;
    --vermelho: #ff5c5c;
    --azul: #5ab4ff;
    --cinza: #6b6f80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
  }
  body { padding: 12px 10px 40px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .subtitulo { color: var(--text-secondary); font-size: 12px; margin: 0 0 12px; }

  .abas { display: flex; gap: 6px; margin-bottom: 10px; }
  .aba-btn {
    flex: 1;
    padding: 10px 4px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    border-radius: 8px;
  }
  .aba-btn.ativa { border-color: var(--azul); color: var(--azul); background: rgba(90,180,255,0.12); }

  .filtros { margin-bottom: 10px; }
  .filtro-select {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .linha-pedido {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--cinza);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .linha-pedido.farol-verde { border-left-color: var(--verde); }
  .linha-pedido.farol-amarelo { border-left-color: var(--amarelo); }
  .linha-pedido.farol-vermelho { border-left-color: var(--vermelho); }

  .linha-topo {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .dot.verde { background: var(--verde); }
  .dot.amarelo { background: var(--amarelo); }
  .dot.vermelho { background: var(--vermelho); }
  .dot.cinza { background: var(--cinza); }
  .linha-info { flex: 1; min-width: 0; }
  .linha-info .num { font-weight: 700; font-size: 14px; }
  .badge-novo {
    display: inline-block;
    background: var(--azul);
    color: #0f1117;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .linha-info .meta { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha-tempo { font-size: 11px; color: var(--text-secondary); flex: 0 0 auto; text-align: right; }

  .linha-detalhe {
    display: none;
    padding: 0 14px 14px;
    border-top: 1px solid var(--border);
  }
  .linha-pedido.aberta .linha-detalhe { display: block; }
  .linha-detalhe p { font-size: 13px; color: var(--text-secondary); margin: 8px 0; line-height: 1.5; }
  .linha-detalhe b { color: var(--text); }

  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-avancar {
    width: 100%;
    padding: 14px;
    background: var(--azul);
    color: #0f1117;
    margin-top: 6px;
  }
  .btn-secundario {
    flex: 1 1 28%;
    min-width: 96px;
    padding: 10px 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
  }
  .btn-secundario.vermelho { color: var(--vermelho); border-color: var(--vermelho); }
  .linha-acoes-secundarias { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .form-inline { margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; }
  .form-inline label { display: block; font-size: 12px; color: var(--text-secondary); margin: 8px 0 4px; }
  .form-inline select, .form-inline textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
  }
  .form-inline textarea { resize: vertical; min-height: 60px; }
  .form-inline .form-botoes { display: flex; gap: 8px; margin-top: 10px; }
  .form-inline .form-botoes button { flex: 1; padding: 10px; }
  .btn-confirmar { background: var(--vermelho); color: #0f1117; }
  .btn-cancelar { background: var(--border); color: var(--text); }

  .vazio, .carregando { text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 14px; }
  .erro { color: var(--vermelho); padding: 16px; text-align: center; font-size: 13px; }

  .gate-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .gate-caixa { width: 100%; max-width: 320px; text-align: center; }
  .gate-caixa h2 { font-size: 17px; margin: 0 0 6px; }
  .gate-caixa p { color: var(--text-secondary); font-size: 13px; margin: 0 0 18px; }
  .gate-caixa input {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    text-align: center;
    margin-bottom: 10px;
  }
  .gate-caixa button {
    width: 100%;
    padding: 14px;
    background: var(--azul);
    color: #0f1117;
  }
  .gate-erro { color: var(--vermelho); font-size: 13px; margin-top: 10px; min-height: 16px; }
  #app { display: none; }
</style>
</head>
<body>
  <div class="gate-overlay" id="gateOverlay">
    <div class="gate-caixa">
      <h2>🚚 EAZY — Status de Entregas</h2>
      <p>Digite o código de acesso que a Patricia te passou. Só precisa fazer isso uma vez neste celular.</p>
      <input type="text" id="gateInput" inputmode="text" autocomplete="off" autocapitalize="off" placeholder="Código de acesso">
      <button type="button" id="gateBotao">Entrar</button>
      <p class="gate-erro" id="gateErro"></p>
    </div>
  </div>

  <div id="app">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
      <div>
        <h1>🚚 Status de Entregas — EAZY</h1>
        <p class="subtitulo" id="subtitulo">Carregando pedidos...</p>
      </div>
      <button type="button" id="btnAtualizar" style="background:transparent; border:1px solid var(--border); color:var(--text-secondary); padding:8px 12px; font-size:13px; flex:0 0 auto;">🔄 Atualizar</button>
    </div>

    <div class="abas" id="abas"></div>
    <div class="filtros" id="filtros"></div>
    <div id="lista"><p class="carregando">Carregando...</p></div>
    <p style="text-align:center; color:var(--text-secondary); font-size:10px; margin-top:20px;" id="buildInfo"></p>
  </div>

<script>
// Identificador de versão visível na tela (rodapé) — serve pra confirmar
// se o navegador está rodando o código novo, antes de investigar qualquer
// outra coisa.
const BUILD_INFO = "mobile-ghpages-v7-2026-09-19";
document.getElementById("buildInfo").textContent = BUILD_INFO;

// Captura QUALQUER erro não tratado (inclusive de dentro de listener de
// clique) e mostra na própria tela, com a versão do build — não depender
// de abrir o console do navegador pra reportar problema.
window.addEventListener("error", (ev) => {
  const msg = (ev && ev.message) || "erro desconhecido";
  const local = `${ev && ev.lineno || "?"}:${ev && ev.colno || "?"}`;
  const areaLista = document.getElementById("lista");
  if (areaLista) {
    areaLista.innerHTML =
      `<p class="erro">Erro na página: ${msg}<br><small>(${local} · ${BUILD_INFO})</small></p>` +
      areaLista.innerHTML;
  }
});

// Página estática (GitHub Pages, repositório PÚBLICO) — fala com o Apps
// Script Web App só via fetch(), mesmo mecanismo já comprovado em
// painel-logistica.html e ml-status-envio.js. Migrado pra cá em
// 2026-09-17 porque a versão anterior (servida pelo próprio Apps Script)
// não abria em navegador mobile — Safari e Chrome Android bloqueiam o
// iframe entre domínios do Google que o Apps Script usa por baixo dos
// panos pra servir HTML.
//
// O token NUNCA fica escrito neste arquivo (o repositório é público —
// qualquer coisa aqui pode ser encontrada por bot de scanning). Em vez
// disso, a pessoa digita o código de acesso na primeira vez que abre a
// página neste celular (tela "gate" abaixo) e ele fica só no
// localStorage do navegador dela — nunca é commitado em lugar nenhum.
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4qgobQUaBGwoY0vspv62HwIJ4V4mxph1uAfmyUf5C0gWQfhgxb7MSK5qGD05mUqRwKg/exec";
const CHAVE_TOKEN_LOCAL = "eazyLogisticaToken";

function tokenSalvo() {
  try { return localStorage.getItem(CHAVE_TOKEN_LOCAL) || ""; } catch (err) { return ""; }
}
function salvarToken(valor) {
  try { localStorage.setItem(CHAVE_TOKEN_LOCAL, valor); } catch (err) { /* sem storage disponível, segue só na memória da sessão */ }
}
function limparTokenSalvo() {
  try { localStorage.removeItem(CHAVE_TOKEN_LOCAL); } catch (err) {}
}

// Mesmas regras de SLA/farol de logistica/painel-logistica.html — não mudam aqui.
const SLA_TEMPO_PARADO = {
  "Triagem":         { verde: 2,  amarelo: 6 },
  "Separado":        { verde: 4,  amarelo: 12 },
  "Embalado":        { verde: 4,  amarelo: 12 },
  "Etiqueta gerada": { verde: 12, amarelo: 24 },
};
const ETAPAS_SEM_SLA = ["Recebido", "Entregue"];
// "Devolução" deixou de ser terminal (2026-09-17) — agora tem uma ação
// própria ("Devolução recebida", confirmando retorno físico do produto)
// antes de sair da lista ativa. "Cancelado" (2026-09-19) — resultado
// possível ao resolver um "Problema" quando o pedido não vai continuar o
// fluxo normal (ex: valor errado, pedido não vai mais sair).
const ETAPAS_TERMINAIS = ["Entregue", "Devolução recebida", "Cancelado"];
// Ordem atualizada em 2026-09-18: "Etiqueta gerada" passou a vir ANTES de
// "Separado" (antes era o contrário).
const ETAPAS_SEQUENCIAIS = ["Recebido", "Triagem", "Etiqueta gerada", "Separado", "Embalado", "Postado", "Em trânsito", "Entregue"];
const SUB_MOTIVOS_DEVOLUCAO = ["Cliente recusou", "Avaria", "Endereço incorreto", "Produto errado enviado", "Prazo extrapolado (cliente desistiu)", "Outro"];
// Status filtráveis na tela mobile — as 8 sequenciais MENOS "Entregue" (que
// nunca aparece aqui, pedidosAtivos() já remove terminais) + os 2 paralelos.
const STATUS_FILTRAVEIS = ETAPAS_SEQUENCIAIS.filter(e => e !== "Entregue").concat(["Problema", "Devolução"]);
// Abas "Concluídos" e "Cancelados" (2026-09-19) — separam os dois tipos de
// pedido finalizado em vez de misturar tudo numa aba única de histórico.
const STATUS_CONCLUIDOS = ["Entregue", "Devolução recebida"];
const STATUS_CANCELADOS = ["Cancelado"];

function calcularFarolTempoParado(etapa, timestampEntrada) {
  const limites = SLA_TEMPO_PARADO[etapa];
  if (!limites || !timestampEntrada) return { cor: "cinza", texto: "sem dado de SLA" };
  const entrada = new Date(timestampEntrada);
  if (isNaN(entrada)) return { cor: "cinza", texto: "timestamp inválido" };
  const horasParado = (Date.now() - entrada.getTime()) / 3600000;
  let cor = "verde";
  if (horasParado > limites.amarelo) cor = "vermelho";
  else if (horasParado > limites.verde) cor = "amarelo";
  const texto = horasParado < 48 ? `${horasParado.toFixed(1)}h parado` : `${(horasParado / 24).toFixed(1)}d parado`;
  return { cor, texto };
}

function calcularFarolPostadoTransito(dataEstimadaEntrega) {
  if (!dataEstimadaEntrega) return { cor: "cinza", texto: "sem data estimada" };
  const estimada = new Date(dataEstimadaEntrega);
  if (isNaN(estimada)) return { cor: "cinza", texto: "data estimada inválida" };
  const diasDeAtraso = (Date.now() - estimada.getTime()) / 86400000;
  let cor = "verde", texto = "dentro do prazo";
  if (diasDeAtraso > 2) { cor = "vermelho"; texto = `${diasDeAtraso.toFixed(1)}d além do prazo`; }
  else if (diasDeAtraso > 1) { cor = "amarelo"; texto = `${diasDeAtraso.toFixed(1)}d além do prazo`; }
  else if (diasDeAtraso > 0) { cor = "amarelo"; texto = "no limite do prazo"; }
  return { cor, texto };
}

function calcularFarol(p) {
  const etapa = p.status_operacional;
  if (etapa === "Postado" || etapa === "Em trânsito") return calcularFarolPostadoTransito(p.data_estimada_entrega);
  if (ETAPAS_SEM_SLA.includes(etapa) || ETAPAS_TERMINAIS.includes(etapa) || etapa === "Problema" || etapa === "Devolução") {
    return { cor: "cinza", texto: null };
  }
  return calcularFarolTempoParado(etapa, p.timestamp_entrada_status_atual);
}

function proximaEtapa(etapaAtual) {
  const i = ETAPAS_SEQUENCIAIS.indexOf(etapaAtual);
  if (i === -1 || i === ETAPAS_SEQUENCIAIS.length - 1) return null;
  return ETAPAS_SEQUENCIAIS[i + 1];
}

let TODOS_PEDIDOS = [];
let FILTRO_ATUAL = "todos";
let ABERTO_ID = null;
// Aba ativa da tela: "ativos" | "concluidos" | "cancelados".
let VISTA_ATUAL = "ativos";
let BUSCA_HISTORICO = "";
let JANELA_HISTORICO = "7";

// Ordem de chegada: mais novo primeiro. data_pedido do Bling só tem dia (sem
// hora), então pedidos do mesmo dia empatam — desempata por pedido_id
// decrescente (IDs do Bling crescem na ordem de criação).
function compararPorChegada(a, b) {
  const da = a.data_pedido ? new Date(a.data_pedido).getTime() : 0;
  const db = b.data_pedido ? new Date(b.data_pedido).getTime() : 0;
  if (db !== da) return db - da;
  return Number(b.pedido_id) - Number(a.pedido_id);
}

// Data em que um pedido concluído/cancelado saiu da lista ativa — usa
// data_entrega quando existe (Entregue), senão o timestamp da troca de
// status mais recente (cobre Devolução recebida e Cancelado, que reiniciam
// timestamp_entrada_status_atual no momento em que entram nesse status).
function dataConclusao(p) {
  return p.data_entrega || p.timestamp_entrada_status_atual || "";
}

// quantidade/valor só existem pra pedidos criados por bling-pedidos-sync.js
// a partir de 2026-09-19 — pedido mais antigo que isso não tem esse dado,
// por isso o "—" em vez de tentar inventar/estimar.
function formatarQuantidade(q) {
  return (q === undefined || q === null || q === "") ? "—" : q;
}
function formatarValor(v) {
  if (v === undefined || v === null || v === "") return "—";
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function compararPorConclusao(a, b) {
  const da = dataConclusao(a) ? new Date(dataConclusao(a)).getTime() : 0;
  const db = dataConclusao(b) ? new Date(dataConclusao(b)).getTime() : 0;
  if (isNaN(da) && isNaN(db)) return 0;
  return (isNaN(db) ? 0 : db) - (isNaN(da) ? 0 : da);
}

// Pedidos em etapa terminal (Entregue / Devolução recebida / Cancelado)
// nunca aparecem na aba "Ativos" — a equipe não tem mais ação a tomar
// neles ali (ficam nas abas "Concluídos"/"Cancelados"). Por isso as
// contagens do dropdown usam a mesma base filtrada da lista, senão o número
// de "Todos" bateria diferente do que aparece embaixo.
function pedidosAtivos() {
  const lista = Array.isArray(TODOS_PEDIDOS) ? TODOS_PEDIDOS : [];
  return lista.filter(p => p && !ETAPAS_TERMINAIS.includes(p.status_operacional));
}

// Busca (por pedido ou cliente) ignora a janela de data; sem busca, aplica
// o corte de dias. Pedido sem data de conclusão nunca é escondido pelo
// corte (evita sumir pedido por dado ausente).
function aplicarFiltroHistorico(lista) {
  const busca = BUSCA_HISTORICO.trim().toLowerCase();
  if (busca) {
    return lista.filter(p =>
      String(p.pedido_id || "").toLowerCase().includes(busca) ||
      String(p.cliente || "").toLowerCase().includes(busca)
    );
  }
  if (JANELA_HISTORICO === "todos") return lista;
  const corte = Date.now() - Number(JANELA_HISTORICO) * 86400000;
  return lista.filter(p => {
    const d = dataConclusao(p);
    if (!d) return true;
    const t = new Date(d).getTime();
    return isNaN(t) || t >= corte;
  });
}

function renderizarAbas() {
  const todos = Array.isArray(TODOS_PEDIDOS) ? TODOS_PEDIDOS : [];
  const abas = [
    { key: "ativos", label: "Ativos", n: pedidosAtivos().length },
    { key: "concluidos", label: "Concluídos", n: todos.filter(p => p && STATUS_CONCLUIDOS.includes(p.status_operacional)).length },
    { key: "cancelados", label: "Cancelados", n: todos.filter(p => p && STATUS_CANCELADOS.includes(p.status_operacional)).length },
  ];
  document.getElementById("abas").innerHTML = abas.map(a =>
    `<button type="button" class="aba-btn ${VISTA_ATUAL === a.key ? 'ativa' : ''}" data-aba="${a.key}">${a.label} (${a.n})</button>`
  ).join("");
  document.querySelectorAll(".aba-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      VISTA_ATUAL = btn.dataset.aba;
      ABERTO_ID = null;
      renderizar();
    });
  });
}

function renderizarFiltroStatus() {
  const ativos = pedidosAtivos();
  const contagem = { todos: ativos.length };
  STATUS_FILTRAVEIS.forEach(s => { contagem[s] = 0; });
  ativos.forEach(p => {
    if (contagem[p.status_operacional] !== undefined) contagem[p.status_operacional]++;
  });

  const opcoes = [`<option value="todos">Todos (${contagem.todos})</option>`]
    .concat(STATUS_FILTRAVEIS.map(s => `<option value="${s}">${s} (${contagem[s]})</option>`))
    .join("");

  document.getElementById("filtros").innerHTML =
    `<select class="filtro-select" id="filtroStatus">${opcoes}</select>`;
  document.getElementById("filtroStatus").value = FILTRO_ATUAL;
  document.getElementById("filtroStatus").addEventListener("change", (ev) => {
    FILTRO_ATUAL = ev.target.value;
    ABERTO_ID = null;
    renderizarLista();
  });
}

function renderizarFiltroHistorico() {
  document.getElementById("filtros").innerHTML = `
    <input type="text" class="filtro-select" id="buscaHistorico" placeholder="Buscar por número de pedido ou cliente...">
    <select class="filtro-select" id="janelaHistorico">
      <option value="7">Últimos 7 dias</option>
      <option value="30">Últimos 30 dias</option>
      <option value="todos">Todos</option>
    </select>
  `;
  const inputBusca = document.getElementById("buscaHistorico");
  const selectJanela = document.getElementById("janelaHistorico");
  inputBusca.value = BUSCA_HISTORICO;
  selectJanela.value = JANELA_HISTORICO;
  // Só atualiza a lista (renderizarLista), nunca renderizar() completo —
  // isso evitaria perder o foco/cursor do campo de texto a cada tecla,
  // já que renderizar() reconstrói o próprio input do zero.
  inputBusca.addEventListener("input", (ev) => {
    BUSCA_HISTORICO = ev.target.value;
    renderizarLista();
  });
  selectJanela.addEventListener("change", (ev) => {
    JANELA_HISTORICO = ev.target.value;
    renderizarLista();
  });
}

function renderizarControles() {
  if (VISTA_ATUAL === "ativos") renderizarFiltroStatus();
  else renderizarFiltroHistorico();
}

function detalheEspecial(p) {
  if (p.status_operacional === "Devolução") {
    let h = `<p><b>Data devolução:</b> ${p.data_devolucao || "—"} · <b>Sub-motivo:</b> ${p.sub_motivo_devolucao || "—"}</p>`;
    if (p.motivo_devolucao) h += `<p><b>Observação:</b> ${p.motivo_devolucao}</p>`;
    return h;
  }
  if (p.status_operacional === "Problema") {
    return `<p><b>Motivo:</b> ${p.motivo_problema || "—"} · <b>Etapa de origem:</b> ${p.status_pre_problema || "—"}</p>`;
  }
  return "";
}

function acoesParaPedido(p) {
  // Devolução já registrada: só falta confirmar que o produto voltou
  // fisicamente — reaproveita o mesmo botão/handler "avancar" de sempre,
  // só que apontando pro valor novo de status em vez da próxima etapa
  // sequencial (Devolução não faz parte de ETAPAS_SEQUENCIAIS).
  if (p.status_operacional === "Devolução") {
    return `<button class="btn-avancar" data-acao="avancar" data-proxima="Devolução recebida">Marcar devolução recebida</button>`;
  }
  // Problema: só tem a ação de resolver (abre as duas opções — voltar ao
  // fluxo ou cancelar o pedido). Antes disso a tela mobile não tinha
  // nenhum botão pra esse status.
  if (p.status_operacional === "Problema") {
    return `<button class="btn-avancar" data-acao="abrir-resolver-problema">Resolver problema</button>`;
  }

  const proxima = proximaEtapa(p.status_operacional);
  let html = "";
  if (proxima) {
    html += `<button class="btn-avancar" data-acao="avancar" data-proxima="${proxima}">Marcar: ${proxima}</button>`;
  }
  if (p.status_operacional !== "Entregue") {
    html += `<div class="linha-acoes-secundarias">
      <button class="btn-secundario" data-acao="abrir-corrigir">Corrigir etapa</button>
      <button class="btn-secundario vermelho" data-acao="abrir-problema">Reportar problema</button>
      <button class="btn-secundario" data-acao="abrir-devolucao">Registrar devolução</button>
    </div>`;
  }
  return html;
}

function formularioProblema() {
  return `<div class="form-inline" data-form="problema">
    <label>O que aconteceu? (obrigatório)</label>
    <textarea data-campo="motivo_problema" placeholder="Ex: endereço não encontrado, cliente ausente..."></textarea>
    <div class="form-botoes">
      <button class="btn-cancelar" data-acao="cancelar-form">Cancelar</button>
      <button class="btn-confirmar" data-acao="confirmar-problema">Confirmar problema</button>
    </div>
  </div>`;
}

function formularioDevolucao() {
  const opcoes = SUB_MOTIVOS_DEVOLUCAO.map(m => `<option value="${m}">${m}</option>`).join("");
  return `<div class="form-inline" data-form="devolucao">
    <label>Sub-motivo (obrigatório)</label>
    <select data-campo="sub_motivo_devolucao">${opcoes}</select>
    <label>Observação (obrigatória se "Outro")</label>
    <textarea data-campo="motivo_devolucao" placeholder="Detalhe o motivo..."></textarea>
    <div class="form-botoes">
      <button class="btn-cancelar" data-acao="cancelar-form">Cancelar</button>
      <button class="btn-confirmar" data-acao="confirmar-devolucao">Confirmar devolução</button>
    </div>
  </div>`;
}

function formularioCorrigirEtapa(etapaAtual) {
  const opcoes = ETAPAS_SEQUENCIAIS.map(e =>
    `<option value="${e}" ${e === etapaAtual ? "selected" : ""}>${e}</option>`
  ).join("");
  return `<div class="form-inline" data-form="corrigir">
    <label>Corrigir para qual etapa? (qualquer uma das 8)</label>
    <select data-campo="nova_etapa">${opcoes}</select>
    <div class="form-botoes">
      <button class="btn-cancelar" data-acao="cancelar-form">Cancelar</button>
      <button class="btn-confirmar" data-acao="confirmar-corrigir">Confirmar correção</button>
    </div>
  </div>`;
}

function formularioResolverProblema(pedido) {
  const etapaAnterior = pedido && pedido.status_pre_problema;
  return `<div class="form-inline" data-form="resolver-problema">
    <label>Motivo do problema registrado</label>
    <p style="font-size:13px; color:var(--text-secondary); margin:4px 0 10px;">${(pedido && pedido.motivo_problema) || "—"}</p>
    <div class="form-botoes">
      <button class="btn-cancelar" data-acao="cancelar-form">Fechar</button>
      <button class="btn-secundario" data-acao="confirmar-voltar-fluxo" ${etapaAnterior ? "" : "disabled"}>Voltar ao fluxo${etapaAnterior ? " (" + etapaAnterior + ")" : ""}</button>
    </div>
    <div class="form-botoes" style="margin-top:8px;">
      <button class="btn-confirmar" data-acao="confirmar-cancelar-pedido" style="width:100%;">Cancelar pedido</button>
    </div>
  </div>`;
}

function renderizarCardAtivo(p) {
  const farol = calcularFarol(p);
  const aberta = String(p.pedido_id) === String(ABERTO_ID);
  return `
    <div class="linha-pedido ${farol.cor !== 'cinza' ? 'farol-' + farol.cor : ''} ${aberta ? 'aberta' : ''}" data-id="${p.pedido_id}">
      <div class="linha-topo" data-acao="expandir">
        <span class="dot ${farol.cor}"></span>
        <div class="linha-info">
          <div class="num">${p.pedido_id} · ${p.canal || '—'}${p.status_operacional === "Recebido" ? ' <span class="badge-novo">Novo</span>' : ''}</div>
          <div class="meta">${p.status_operacional} — ${p.produto || ''}</div>
        </div>
        <div class="linha-tempo">${farol.texto || ''}</div>
      </div>
      <div class="linha-detalhe">
        <p><b>Cliente:</b> ${p.cliente || '—'}</p>
        <p><b>Produto:</b> ${p.produto || '—'}</p>
        <p><b>Quantidade:</b> ${formatarQuantidade(p.quantidade)} · <b>Valor:</b> ${formatarValor(p.valor)}</p>
        ${p.codigo_rastreio ? `<p><b>Rastreio:</b> ${p.codigo_rastreio}${p.data_postado ? ' · postado em ' + p.data_postado : ''}</p>` : ''}
        ${detalheEspecial(p)}
        <div data-area-acoes>${acoesParaPedido(p)}</div>
      </div>
    </div>
  `;
}

// Detalhe extra mostrado nas abas "Concluídos"/"Cancelados" — sem farol,
// sem botão de ação, só consulta.
function detalheHistorico(p) {
  if (p.status_operacional === "Entregue") {
    return `<p><b>Entregue em:</b> ${p.data_entrega || "—"}</p>`;
  }
  if (p.status_operacional === "Devolução recebida") {
    let h = `<p><b>Sub-motivo:</b> ${p.sub_motivo_devolucao || "—"}</p>`;
    if (p.motivo_devolucao) h += `<p><b>Observação:</b> ${p.motivo_devolucao}</p>`;
    return h;
  }
  if (p.status_operacional === "Cancelado") {
    return `<p><b>Motivo do problema original:</b> ${p.motivo_problema || "—"}</p>`;
  }
  return "";
}

function renderizarCardHistorico(p) {
  const aberta = String(p.pedido_id) === String(ABERTO_ID);
  const concluidoEm = dataConclusao(p);
  return `
    <div class="linha-pedido ${aberta ? 'aberta' : ''}" data-id="${p.pedido_id}">
      <div class="linha-topo" data-acao="expandir">
        <span class="dot cinza"></span>
        <div class="linha-info">
          <div class="num">${p.pedido_id} · ${p.canal || '—'}</div>
          <div class="meta">${p.status_operacional} — ${p.produto || ''}</div>
        </div>
        <div class="linha-tempo">${concluidoEm ? String(concluidoEm).slice(0, 10) : ''}</div>
      </div>
      <div class="linha-detalhe">
        <p><b>Cliente:</b> ${p.cliente || '—'}</p>
        <p><b>Produto:</b> ${p.produto || '—'}</p>
        <p><b>Quantidade:</b> ${formatarQuantidade(p.quantidade)} · <b>Valor:</b> ${formatarValor(p.valor)}</p>
        ${detalheHistorico(p)}
      </div>
    </div>
  `;
}

function renderizar() {
  renderizarAbas();
  renderizarControles();
  renderizarLista();
}

function renderizarLista() {
  const listaEl = document.getElementById("lista");
  let itens;

  if (VISTA_ATUAL === "ativos") {
    let filtrados = pedidosAtivos();
    if (FILTRO_ATUAL !== "todos") {
      filtrados = filtrados.filter(p => p.status_operacional === FILTRO_ATUAL);
    }
    filtrados.sort(compararPorChegada);
    if (filtrados.length === 0) {
      listaEl.innerHTML = '<p class="vazio">Nenhum pedido nesse filtro.</p>';
      return;
    }
    itens = filtrados.map(renderizarCardAtivo).join("");
  } else {
    const statusAlvo = VISTA_ATUAL === "concluidos" ? STATUS_CONCLUIDOS : STATUS_CANCELADOS;
    let lista = (Array.isArray(TODOS_PEDIDOS) ? TODOS_PEDIDOS : []).filter(p => p && statusAlvo.includes(p.status_operacional));
    lista = aplicarFiltroHistorico(lista);
    lista.sort(compararPorConclusao);
    if (lista.length === 0) {
      listaEl.innerHTML = '<p class="vazio">Nenhum pedido encontrado.</p>';
      return;
    }
    itens = lista.map(renderizarCardHistorico).join("");
  }

  listaEl.innerHTML = itens;
  ligarListenersLista();
}

function ligarListenersLista() {
  document.querySelectorAll('[data-acao="expandir"]').forEach(el => {
    el.addEventListener("click", () => {
      const card = el.closest(".linha-pedido");
      const id = card.dataset.id;
      ABERTO_ID = (String(ABERTO_ID) === String(id)) ? null : id;
      renderizarLista();
    });
  });

  document.querySelectorAll('[data-acao="avancar"]').forEach(el => {
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const card = el.closest(".linha-pedido");
      const proxima = el.dataset.proxima;
      marcarEtapa(card.dataset.id, proxima);
    });
  });

  document.querySelectorAll('[data-acao="abrir-problema"]').forEach(el => {
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      // Capturar o pedidoId ANTES de trocar o innerHTML de `area` — depois
      // dessa troca, `el` (que está dentro de `area`) fica desconectado do
      // documento e `el.closest(...)` passa a retornar null.
      const pedidoId = el.closest(".linha-pedido").dataset.id;
      const area = el.closest("[data-area-acoes]");
      area.innerHTML = formularioProblema();
      ligarBotoesForm(area, pedidoId);
    });
  });

  document.querySelectorAll('[data-acao="abrir-devolucao"]').forEach(el => {
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const pedidoId = el.closest(".linha-pedido").dataset.id;
      const area = el.closest("[data-area-acoes]");
      area.innerHTML = formularioDevolucao();
      ligarBotoesForm(area, pedidoId);
    });
  });

  document.querySelectorAll('[data-acao="abrir-corrigir"]').forEach(el => {
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const pedidoId = el.closest(".linha-pedido").dataset.id;
      const pedido = TODOS_PEDIDOS.find(p => String(p.pedido_id) === String(pedidoId));
      const area = el.closest("[data-area-acoes]");
      area.innerHTML = formularioCorrigirEtapa(pedido ? pedido.status_operacional : "");
      ligarBotoesForm(area, pedidoId);
    });
  });

  document.querySelectorAll('[data-acao="abrir-resolver-problema"]').forEach(el => {
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const pedidoId = el.closest(".linha-pedido").dataset.id;
      const pedido = TODOS_PEDIDOS.find(p => String(p.pedido_id) === String(pedidoId));
      const area = el.closest("[data-area-acoes]");
      area.innerHTML = formularioResolverProblema(pedido);
      ligarBotoesForm(area, pedidoId);
    });
  });
}

function ligarBotoesForm(area, pedidoId) {
  const cancelar = area.querySelector('[data-acao="cancelar-form"]');
  if (cancelar) cancelar.addEventListener("click", (ev) => { ev.stopPropagation(); renderizarLista(); });

  const confirmarProblema = area.querySelector('[data-acao="confirmar-problema"]');
  if (confirmarProblema) {
    confirmarProblema.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const motivo = area.querySelector('[data-campo="motivo_problema"]').value.trim();
      if (!motivo) { alert("Descreva o problema antes de confirmar."); return; }
      const pedido = TODOS_PEDIDOS.find(p => String(p.pedido_id) === String(pedidoId));
      gravar({
        pedido_id: pedidoId,
        status_operacional: "Problema",
        status_pre_problema: pedido ? pedido.status_operacional : "",
        motivo_problema: motivo,
      });
    });
  }

  const confirmarDevolucao = area.querySelector('[data-acao="confirmar-devolucao"]');
  if (confirmarDevolucao) {
    confirmarDevolucao.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const subMotivo = area.querySelector('[data-campo="sub_motivo_devolucao"]').value;
      const observacao = area.querySelector('[data-campo="motivo_devolucao"]').value.trim();
      if (subMotivo === "Outro" && !observacao) {
        alert('Observação é obrigatória quando o sub-motivo é "Outro".');
        return;
      }
      gravar({
        pedido_id: pedidoId,
        status_operacional: "Devolução",
        sub_motivo_devolucao: subMotivo,
        motivo_devolucao: observacao,
        data_devolucao: new Date().toISOString().slice(0, 10),
      });
    });
  }

  const confirmarCorrigir = area.querySelector('[data-acao="confirmar-corrigir"]');
  if (confirmarCorrigir) {
    confirmarCorrigir.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const novaEtapa = area.querySelector('[data-campo="nova_etapa"]').value;
      gravar({ pedido_id: pedidoId, status_operacional: novaEtapa });
    });
  }

  const confirmarVoltarFluxo = area.querySelector('[data-acao="confirmar-voltar-fluxo"]');
  if (confirmarVoltarFluxo) {
    confirmarVoltarFluxo.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const pedido = TODOS_PEDIDOS.find(p => String(p.pedido_id) === String(pedidoId));
      const etapaAnterior = pedido && pedido.status_pre_problema;
      if (!etapaAnterior) { alert("Etapa anterior não registrada para este pedido."); return; }
      gravar({ pedido_id: pedidoId, status_operacional: etapaAnterior });
    });
  }

  const confirmarCancelarPedido = area.querySelector('[data-acao="confirmar-cancelar-pedido"]');
  if (confirmarCancelarPedido) {
    confirmarCancelarPedido.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (!confirm("Confirma cancelar este pedido? Ele sai da lista de pedidos ativos e vai pra aba \"Cancelados\".")) return;
      gravar({ pedido_id: pedidoId, status_operacional: "Cancelado" });
    });
  }
}

function marcarEtapa(pedidoId, novaEtapa) {
  gravar({ pedido_id: pedidoId, status_operacional: novaEtapa });
}

// Quando o servidor diz que o token está errado, o código salvo neste
// celular está errado/desatualizado — limpa e pede de novo, em vez de só
// mostrar um erro genérico que a pessoa não vai saber resolver sozinha.
function tokenInvalido() {
  limparTokenSalvo();
  document.getElementById("app").style.display = "none";
  document.getElementById("gateOverlay").style.display = "flex";
  document.getElementById("gateErro").textContent = "Código incorreto. Tente de novo.";
  document.getElementById("gateInput").value = "";
  document.getElementById("gateInput").focus();
}

function gravar(camposParciais) {
  const payload = Object.assign({ action: "upsert_pedido", origem: "mobile-entrega", token: tokenSalvo() }, camposParciais);
  document.getElementById("subtitulo").textContent = "Salvando...";
  // Content-Type text/plain de propósito: evita o preflight de CORS que o
  // Apps Script não sabe responder (não tem doOptions) — ele lê o corpo
  // como JSON de qualquer forma, o Content-Type aqui é só pra passar pelo
  // navegador sem preflight.
  fetch(WEB_APP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  })
    .then((res) => res.json())
    .then((data) => {
      if (!data.ok) throw new Error(data.erro || "erro desconhecido ao gravar");
      ABERTO_ID = null;
      carregar();
    })
    .catch((err) => {
      if (err.message === "token inválido") { tokenInvalido(); return; }
      alert("Erro ao salvar: " + err.message);
      carregar();
    });
}

function carregar() {
  return fetch(`${WEB_APP_URL}?action=list&token=${encodeURIComponent(tokenSalvo())}`)
    .then((res) => res.json())
    .then((data) => {
      if (!Array.isArray(data.pedidos)) {
        throw new Error(data.erro || "resposta inesperada do Apps Script");
      }
      TODOS_PEDIDOS = data.pedidos;
      document.getElementById("subtitulo").textContent =
        `${TODOS_PEDIDOS.length} pedido(s) — atualizado às ${new Date().toLocaleTimeString("pt-BR")}`;
      renderizar();
    })
    .catch((err) => {
      if (err.message === "token inválido") { tokenInvalido(); return; }
      document.getElementById("lista").innerHTML =
        `<p class="erro">Erro ao carregar pedidos: ${err.message}</p>`;
      document.getElementById("subtitulo").textContent = "Erro ao carregar — toque em Atualizar.";
    });
}

// Feedback visual explícito no botão — sem isso, um clique que não muda
// nenhum dado parece "não ter feito nada" na tela.
document.getElementById("btnAtualizar").addEventListener("click", () => {
  const btn = document.getElementById("btnAtualizar");
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Atualizando...";
  carregar().finally(() => {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  });
});

// Gate de código de acesso — só passa daqui se tiver um token salvo (já
// digitado antes neste navegador) ou digitar um agora.
function entrarComToken(valor) {
  salvarToken(valor);
  document.getElementById("gateErro").textContent = "";
  document.getElementById("gateOverlay").style.display = "none";
  document.getElementById("app").style.display = "block";
  carregar();
}

document.getElementById("gateBotao").addEventListener("click", () => {
  const valor = document.getElementById("gateInput").value.trim();
  if (!valor) { document.getElementById("gateErro").textContent = "Digite o código de acesso."; return; }
  entrarComToken(valor);
});
document.getElementById("gateInput").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") document.getElementById("gateBotao").click();
});

if (tokenSalvo()) {
  document.getElementById("gateOverlay").style.display = "none";
  document.getElementById("app").style.display = "block";
  carregar();
}
</script>
</body>
</html>
